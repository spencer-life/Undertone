# Adapted from spencer-life/github-workflows/.github/workflows/ci-mise.yml
# Source revision: 742d149b1e75ef50184861f984fcfe82dfe9d833
name: Core CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ci: ${{ steps.scope.outputs.ci }}
      e2e: ${{ steps.scope.outputs.e2e }}
      visual: ${{ steps.scope.outputs.visual }}
      vgpu: ${{ steps.scope.outputs.vgpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test check selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_scope.py'
      - id: scope
        name: Select checks from the complete PR merge diff
        run: python3 .github/scripts/ci_scope.py
  ci:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ci == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require valid check selection
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo 'Check selection failed; refusing a green Core check.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          cache: true
      - id: cache-paths
        run: mise run cache:paths
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-paths.outputs.pnpm }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run ci
  e2e:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          cache: true
      - id: cache-paths
        run: mise run cache:paths
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-paths.outputs.pnpm }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm/_cacache
          key: agent-browser-npm-${{ runner.os }}-${{ runner.arch }}-0.33.0
      - run: mise run e2e:ci
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-a11y
          path: |
            playwright-report/
            test-results/
            !test-results/harness/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
  visual:
    needs: changes
    if: ${{ needs.changes.outputs.visual == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          cache: true
      - id: cache-paths
        run: mise run cache:paths
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-paths.outputs.pnpm }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.55.0
      - run: mise run visual:ci
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review
          path: .visual-review/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  vgpu:
    needs: changes
    if: ${{ needs.changes.outputs.vgpu == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          cache: true
      - id: cache-paths
        run: mise run cache:paths
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.cache-paths.outputs.pnpm }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/vgpu/software-renderer
          key: vgpu-software-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.npm/_cacache
          key: agent-browser-npm-${{ runner.os }}-${{ runner.arch }}-0.33.0
      - run: mise run vgpu:ci
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vgpu-render-review
          path: |
            .vgpu-ci/
            !.vgpu-ci/harness/**
            artifacts/orbit-t0.ppm
            artifacts/orbit-t25.ppm
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
