# Local adaptation of github-workflows/visual-review.yml; Vercel remains the deployer.
name: Visual Review
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: visual-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-runtime
      - run: mise run visual:ci
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-review
          path: .visual-review/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
