[tools]
"aqua:pnpm/pnpm" = "12.5.1"
node = "24.18.0"
"npm:vgpu" = "0.5.0"

[tasks.ci]
description = "Install dependencies and run the repository CI contract"
run = '''
set -eu
pnpm install --frozen-lockfile
pnpm check
pnpm test
pnpm build
'''


[tasks."visual:ci"]
description = "Capture deterministic Playwright screenshots for rendered QA"
run = "bash scripts/visual-review.sh"


[tasks."vgpu:ci"]
description = "Validate Undertone WebGPU shaders, deterministic pixels, and browser WebGPU rendering"
run = '''
set -eu
pnpm install --frozen-lockfile
bash scripts/vgpu-ci.sh
'''
